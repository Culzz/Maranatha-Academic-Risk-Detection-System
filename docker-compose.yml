version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maranatha_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/maranatha_risk
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost,http://localhost:80"
      CDN_URL: ${CDN_URL:-}
    volumes:
      - uploads:/app/uploads
      - ml_models:/app/ml/outputs
    ports:
      - "8000:8000"

  # Celery worker — processes background tasks (email, SMS, ML)
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/maranatha_risk
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - ml_models:/app/ml/outputs
    command: celery -A celery_app worker --loglevel=info --pool=prefork --concurrency=4 -Q default,email,ml

  # Celery Beat — periodic task scheduler (token cleanup, etc.)
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/maranatha_risk
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      REDIS_URL: redis://redis:6379/0
    command: celery -A celery_app beat --loglevel=info

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_CDN_URL: ${CDN_URL:-/}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
  uploads:
  ml_models:
